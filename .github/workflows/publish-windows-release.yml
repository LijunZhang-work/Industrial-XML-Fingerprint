name: Publish Windows portable release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/publish-windows-release.yml"
      - "pyproject.toml"
      - "release/*.zip"
      - "release/*.sha256"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Verify version and release artifacts
        shell: pwsh
        env:
          TRIGGER_REF_NAME: ${{ github.ref_name }}
          TRIGGER_REF_TYPE: ${{ github.ref_type }}
        run: |
          $pyproject = Get-Content -LiteralPath 'pyproject.toml' -Raw
          $versionMatch = [regex]::Match($pyproject, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) {
            throw "Could not read the project version from pyproject.toml."
          }
          $version = $versionMatch.Groups[1].Value
          $tag = "v$version"
          if ($env:TRIGGER_REF_TYPE -eq 'tag' -and $env:TRIGGER_REF_NAME -ne $tag) {
            throw "Tag version does not match pyproject.toml."
          }

          $zipPath = "release/Industrial-XML-Fingerprint-$tag-windows-x64.zip"
          $shaPath = "$zipPath.sha256"
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "The Windows portable ZIP is missing."
          }
          if (-not (Test-Path -LiteralPath $shaPath -PathType Leaf)) {
            throw "The SHA-256 sidecar is missing."
          }

          $expectedHash = ((Get-Content -LiteralPath $shaPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "The Windows portable ZIP does not match its SHA-256 sidecar."
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$shaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create the version tag when publishing from main
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          git fetch --tags --force
          $existingCommit = & git rev-list -n 1 $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingCommit -ne $env:GITHUB_SHA) {
              throw "The release tag already exists at a different commit; bump the project version."
            }
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $env:RELEASE_TAG -m "Industrial XML Fingerprint $env:RELEASE_TAG" $env:GITHUB_SHA
          git push origin "refs/tags/$env:RELEASE_TAG"

      - name: Create GitHub Release and upload verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null) {
            Write-Host "Release $env:RELEASE_TAG already exists; no changes were made."
            exit 0
          }
          gh release create $env:RELEASE_TAG $env:RELEASE_ZIP $env:RELEASE_SHA `
            --repo $env:GITHUB_REPOSITORY `
            --title "Industrial XML Fingerprint $env:RELEASE_TAG" `
            --notes "Windows x64 免安装版：下载 ZIP 后完整解压即可使用，无需另装 Python。SHA-256 校验文件随 Release 一并提供。" `
            --verify-tag
